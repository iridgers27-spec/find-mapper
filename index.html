}

#findsButton {

}

#findButton {

  position: fixed;

  bottom: 25px;

  left: 50%;

  color: white;

  border-radius: 30px;

}

  padding: 20px;

}

  display: none;

  top: 10px;

  left: 10px;

}

}

}

}

}

}

#findNumber {

}

#recorded {

  font-size: 14px;

  color: #555;

  margin-top: 5px;

  margin-bottom: 15px;

}

button {

  padding: 12px;

  font-size: 17px;

  border-radius: 10px;

  border: none;

  margin-right: 5px;

}

#save {

  background: #147ef5;

  color: white;

}

#cancel {

  background: #ddd;

}

#photoButtons {

  display: flex;

  gap: 8px;

  margin-top: 5px;

}

.photoButton {

  flex: 1;

  background: #eee;

  padding: 12px;

  border-radius: 10px;

  text-align: center;

  font-size: 16px;

  cursor: pointer;

</script>

<script>

let map;

let currentLocation;

let editingFind = null;

let pendingPhoto = null;

let finds =

JSON.parse(

localStorage.getItem("finds") || "[]"

);

function nextFindNumber() {

  let highest = 0;

  finds.forEach(function(find) {

    if (

      find.number &&

      Number(find.number) > highest

    ) {

      highest =

      Number(find.number);

    }

  });

  return highest + 1;

}

function formatDate(date) {

  return date.toLocaleString(

    "en-GB",

    {

      day: "2-digit",

      month: "2-digit",

      year: "numeric",

      hour: "2-digit",

      minute: "2-digit"

    }

  );

}

function compressPhoto(file) {

  return new Promise(function(resolve) {

    let reader =

    new FileReader();

    reader.onload = function(event) {

      let img =

      new Image();

      img.onload = function() {

        let maxSize = 1200;

        let width = img.width;

        let height = img.height;

        if (width > height) {

          if (width > maxSize) {

            height =

            height *

            maxSize /

            width;

            width =

            maxSize;

          }

        }

        else {

          if (height > maxSize) {

            width =

            width *

            maxSize /

            height;

            height =

            maxSize;

          }

        }

        let canvas =

        document.createElement("canvas");

        canvas.width = width;

        canvas.height = height;

        let ctx =

        canvas.getContext("2d");

        ctx.drawImage(

          img,

          0,

          0,

          width,

          height

        );

        resolve(

          canvas.toDataURL(

            "image/jpeg",

            0.75

          )

        );

      };

      img.src =

      event.target.result;

    };

    reader.readAsDataURL(file);

  });

}

function handlePhoto(file) {

  if (!file) return;

  compressPhoto(file)

  .then(function(photo) {

    pendingPhoto = photo;

    let preview =

    document.getElementById(

      "photoPreview"

    );

    preview.src =

    photo;

    preview.style.display =

    "block";

  });

}

document.getElementById(

  "cameraInput"

).addEventListener(

  "change",

  function(event) {

    handlePhoto(

      event.target.files[0]

    );

  }

);

document.getElementById(

  "libraryInput"

).addEventListener(

  "change",

  function(event) {

    handlePhoto(

      event.target.files[0]

    );

  }

);
