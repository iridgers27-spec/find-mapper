<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>Find Mapper</title>

<link rel="stylesheet"

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  font-family: Arial, sans-serif;

}

#map {

  width: 100%;

  height: 100%;

}

button {

  border: none;

  border-radius: 10px;

  padding: 12px 16px;

  font-size: 16px;

  font-weight: bold;

}

/* =====================================================

   MAP BUTTONS

===================================================== */

#findsButton {

  position: fixed;

  top: 15px;

  right: 15px;

  z-index: 1000;

  background: white;

  box-shadow: 0 2px 8px #555;

}

#findButtons {

  position: fixed;

  bottom: 25px;

  left: 10px;

  right: 10px;

  z-index: 1000;

  display: flex;

  gap: 10px;

}

#findButton,

#placeFindButton {

  flex: 1;

  padding: 16px 8px;

  border-radius: 30px;

  font-size: 18px;

}

#findButton {

  background: #147ef5;

  color: white;

}

#placeFindButton {

  background: white;

  color: #147ef5;

  box-shadow: 0 2px 8px #555;

}

/* =====================================================

   PLACE FIND MESSAGE

===================================================== */

#placeMessage {

  display: none;

  position: fixed;

  top: 70px;

  left: 15px;

  right: 15px;

  z-index: 1500;

  background: white;

  border-radius: 15px;

  padding: 15px;

  box-shadow: 0 2px 12px #555;

  text-align: center;

  font-weight: bold;

}

#cancelPlace {

  display: block;

  width: 100%;

  margin-top: 10px;

  background: #ddd;

}

/* =====================================================

   FORM

===================================================== */

#form,

#findsPanel {

  display: none;

  position: fixed;

  z-index: 2000;

  background: white;

  box-shadow: 0 2px 15px #555;

  border-radius: 18px;

}

#form {

  left: 10px;

  right: 10px;

  bottom: 10px;

  padding: 20px;

  max-height: 90vh;

  overflow-y: auto;

}

#findsPanel {

  top: 10px;

  left: 10px;

  right: 10px;

  bottom: 10px;

  padding: 20px;

  overflow-y: auto;

}

#findsPanel h2 {

  margin-top: 0;

}

#closeFinds {

  float: right;

  background: #ddd;

}

#title {

  margin-top: 0;

}

#findNumber {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 15px;

}

#positionInfo {

  white-space: pre-line;

  background: #f1f1f1;

  padding: 10px;

  border-radius: 8px;

  font-size: 14px;

  margin-bottom: 15px;

}

label {

  display: block;

  font-weight: bold;

  margin-top: 10px;

}

input,

textarea {

  width: 100%;

  box-sizing: border-box;

  padding: 12px;

  margin-top: 6px;

  margin-bottom: 10px;

  font-size: 17px;

  border: 1px solid #bbb;

  border-radius: 8px;

}

textarea {

  min-height: 100px;

}

#recorded {

  font-size: 14px;

  color: #666;

  margin-bottom: 15px;

}

#save {

  background: #147ef5;

  color: white;

  width: 100%;

}

#cancel {

  background: #ddd;

  color: #111;

  width: 100%;

  margin-top: 8px;

}

#deleteFind {

  width: 100%;

  background: #ff3b30;

  color: white;

  margin-top: 15px;

}

/* =====================================================

   PHOTO

===================================================== */

#photoButtons {

  display: flex;

  gap: 8px;

}

.photoButton {

  flex: 1;

  background: #eee;

  padding: 12px;

  border-radius: 10px;

  text-align: center;

  font-size: 16px;

  cursor: pointer;

}

#cameraInput,

#libraryInput {

  display: none;

}

#photoPreview {

  display: none;

  width: 100%;

  max-height: 300px;

  object-fit: contain;

  margin-top: 10px;

  border-radius: 10px;

}

/* =====================================================

   FIND LIST

===================================================== */

.findItem {

  padding: 15px 5px;

  border-bottom: 1px solid #ddd;

  cursor: pointer;

}

.findItem strong {

  font-size: 18px;

}

.findItem small {

  display: block;

  color: #666;

  margin-top: 5px;

}

#noFinds {

  color: #666;

  padding: 20px 0;

}

/* =====================================================

   EXPORT BUTTONS

===================================================== */

#backupButton,

#csvButton {

  width: 100%;

  margin-top: 15px;

  padding: 15px;

  font-size: 17px;

}

#backupButton {

  background: #34c759;

  color: white;

}

#csvButton {

  background: #147ef5;

  color: white;

}

/* =====================================================

   BLUE FIND DOT

===================================================== */

.find-dot {

  width: 16px;

  height: 16px;

  background: #147ef5;

  border: 3px solid white;

  border-radius: 50%;

  box-shadow: 0 1px 5px #333;

}

</style>

</head>

<body>

<div id="map"></div>

<button id="findsButton">

☰ FINDS

</button>

<div id="findButtons">

<button id="findButton">

＋ FIND

</button>

<button id="placeFindButton">

📍 PLACE FIND

</button>

</div>

<div id="placeMessage">

PLACE FIND

<br><br>

Tap anywhere on the map to place the find.

<button id="cancelPlace">

CANCEL

</button>

</div>

<!-- =====================================================

     FIND FORM

===================================================== -->

<div id="form">

<h2 id="title">

New Find

</h2>

<div id="findNumber"></div>

<div id="positionInfo"></div>

<label>Find</label>

<input

id="find"

autocomplete="off">

<label>Material</label>

<input

id="material"

autocomplete="off">

<label>Date / Era</label>

<input

id="era"

autocomplete="off">

<label>Remarks</label>

<textarea

id="remarks"

placeholder="Enter any additional information...">

</textarea>

<label>Photo</label>

<div id="photoButtons">

<label

for="cameraInput"

class="photoButton">

📷 Take Photo

</label>

<label

for="libraryInput"

class="photoButton">

🖼️ Choose Photo

</label>

</div>

<input

type="file"

id="cameraInput"

accept="image/*"

capture="environment">

<input

type="file"

id="libraryInput"

accept="image/*">

<img

id="photoPreview">

<div id="recorded"></div>

<button

id="save"

type="button">

SAVE

</button>

<button

id="cancel"

type="button">

CANCEL

</button>

<button

id="deleteFind"

type="button">

🗑️ DELETE FIND

</button>

</div>

<!-- =====================================================

     FINDS PANEL

===================================================== -->

<div id="findsPanel">

<button

id="closeFinds"

type="button">

CLOSE

</button>

<h2>

My Finds

</h2>

<div id="findList"></div>

<button

id="backupButton"

type="button">

💾 BACKUP / EXPORT FINDS

</button>

<button

id="csvButton"

type="button">

📊 EXPORT TO CSV

</button>

</div>

<script

src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

</script>

<script>

/* =====================================================

   GLOBAL VARIABLES

===================================================== */

let map = null;

let currentLocation = null;

let editingFind = null;

let pendingPhoto = null;

let placingFind = false;

let selectedLocation = null;

let temporaryMarker = null;

let finds = [];

/* =====================================================

   INDEXED DB

===================================================== */

const DB_NAME =

"FindMapperDatabase";

const DB_VERSION = 1;

const STORE_NAME =

"finds";

let db = null;

/* =====================================================

   OPEN DATABASE

===================================================== */

function openDatabase() {

  return new Promise(

    function(resolve, reject) {

      const request =

      indexedDB.open(

        DB_NAME,

        DB_VERSION

      );

      request.onupgradeneeded =

      function(event) {

        const database =

        event.target.result;

        if (

          !database.objectStoreNames.contains(

            STORE_NAME

          )

        ) {

          database.createObjectStore(

            STORE_NAME,

            {

              keyPath:

              "id",

              autoIncrement:

              true

            }

          );

        }

      };

      request.onsuccess =

      function(event) {

        db =

        event.target.result;

        resolve(db);

      };

      request.onerror =

      function(event) {

        reject(

          event.target.error

        );

      };

    }

  );

}

/* =====================================================

   GET ALL FINDS

===================================================== */

function getAllFinds() {

  return new Promise(

    function(resolve, reject) {

      const transaction =

      db.transaction(

        STORE_NAME,

        "readonly"

      );

      const store =

      transaction.objectStore(

        STORE_NAME

      );

      const request =

      store.getAll();

      request.onsuccess =

      function() {

        resolve(

          request.result || []

        );

      };

      request.onerror =

      function() {

        reject(

          request.error

        );

      };

    }

  );

}

/* =====================================================

   ADD FIND

===================================================== */

function addFindToDatabase(find) {

  return new Promise(

    function(resolve, reject) {

      const transaction =

      db.transaction(

        STORE_NAME,

        "readwrite"

      );

      const store =

      transaction.objectStore(

        STORE_NAME

      );

      const request =

      store.add(find);

      request.onsuccess =

      function() {

        find.id =

        request.result;

        resolve(find);

      };

      request.onerror =

      function() {

        reject(

          request.error

        );

      };

    }

  );

}

/* =====================================================

   UPDATE FIND

===================================================== */

function updateFindInDatabase(find) {

  return new Promise(

    function(resolve, reject) {

      const transaction =

      db.transaction(

        STORE_NAME,

        "readwrite"

      );

      const store =

      transaction.objectStore(

        STORE_NAME

      );

      const request =

      store.put(find);

      request.onsuccess =

      function() {

        resolve(find);

      };

      request.onerror =

      function() {

        reject(

          request.error

        );

      };

    }

  );

}

/* =====================================================

   DELETE FIND FROM DATABASE

===================================================== */

function deleteFindFromDatabase(find) {

  return new Promise(

    function(resolve, reject) {

      const transaction =

      db.transaction(

        STORE_NAME,

        "readwrite"

      );

      const store =

      transaction.objectStore(

        STORE_NAME

      );

      const request =

      store.delete(find.id);

      request.onsuccess =

      function() {

        resolve();

      };

      request.onerror =

      function() {

        reject(

          request.error

        );

      };

    }

  );

}

/* =====================================================

   MIGRATE OLD LOCALSTORAGE DATA

===================================================== */

async function migrateOldFinds() {

  let oldFinds = [];

  try {

    oldFinds =

    JSON.parse(

      localStorage.getItem("finds") || "[]"

    );

  }

  catch(error) {

    oldFinds = [];

  }

  if (

    !Array.isArray(oldFinds) ||

    oldFinds.length === 0

  ) {

    return;

  }

  const existing =

  await getAllFinds();

  if (existing.length > 0) {

    return;

  }

  for (

    let i = 0;

    i < oldFinds.length;

    i++

  ) {

    const oldFind =

    oldFinds[i];

    const newFind = {

      number:

      oldFind.number,

      find:

      oldFind.find || "",

      material:

      oldFind.material || "",

      era:

      oldFind.era || "",

      remarks:

      oldFind.remarks || "",

      lat:

      oldFind.lat,

      lng:

      oldFind.lng,

      recorded:

      oldFind.recorded || "",

      photo:

      oldFind.photo || null

    };

    await addFindToDatabase(

      newFind

    );

  }

  /*

     Keep the old data for now.

     It is deliberately NOT deleted.

     This gives us an extra safety copy.

  */

}

/* =====================================================

   LOAD DATABASE

===================================================== */

async function loadFinds() {

  finds =

  await getAllFinds();

}

/* =====================================================

   NEXT FIND NUMBER

===================================================== */

function nextFindNumber() {

  let highest = 0;

  finds.forEach(

    function(find) {

      const number =

      Number(find.number);

      if (

        Number.isFinite(number) &&

        number > highest

      ) {

        highest =

        number;

      }

    }

  );

  return highest + 1;

}

/* =====================================================

   DATE

===================================================== */

function formatDate(date) {

  return date.toLocaleString(

    "en-GB",

    {

      day: "2-digit",

      month: "2-digit",

      year: "numeric",

      hour: "2-digit",

      minute: "2-digit"

    }

  );

}

/* =====================================================

   PHOTO COMPRESSION

===================================================== */

function compressPhoto(file) {

  return new Promise(

    function(resolve, reject) {

      const reader =

      new FileReader();

      reader.onload =

      function(event) {

        const img =

        new Image();

        img.onload =

        function() {

          const maxSize =

          1200;

          let width =

          img.width;

          let height =

          img.height;

          if (width > height) {

            if (

              width > maxSize

            ) {

              height =

              height *

              maxSize /

              width;

              width =

              maxSize;

            }

          }

          else {

            if (

              height > maxSize

            ) {

              width =

              width *

              maxSize /

              height;

              height =

              maxSize;

            }

          }

          const canvas =

          document.createElement(

            "canvas"

          );

          canvas.width =

          width;

          canvas.height =

          height;

          const ctx =

          canvas.getContext(

            "2d"

          );

          ctx.drawImage(

            img,

            0,

            0,

            width,

            height

          );

          resolve(

            canvas.toDataURL(

              "image/jpeg",

              0.75

            )

          );

        };

        img.onerror =

        function() {

          reject(

            new Error(

              "Could not load photo."

            )

          );

        };

        img.src =

        event.target.result;

      };

      reader.onerror =

      function() {

        reject(

          new Error(

            "Could not read photo."

          )

        );

      };

      reader.readAsDataURL(

        file

      );

    }

  );

}

/* =====================================================

   HANDLE PHOTO

===================================================== */

function handlePhoto(file) {

  if (!file) {

    return;

  }

  compressPhoto(file)

  .then(

    function(photo) {

      pendingPhoto =

      photo;

      const preview =

      document.getElementById(

        "photoPreview"

      );

      preview.src =

      photo;

      preview.style.display =

      "block";

    }

  )

  .catch(

    function(error) {

      console.error(error);

      alert(

        "The photo could not be loaded."

      );

    }

  );

}

document.getElementById(

"cameraInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

document.getElementById(

"libraryInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

/* =====================================================

   BLUE DOT ICON

===================================================== */

function findIcon() {

  return L.divIcon({

    className: "",

    html:

    '<div class="find-dot"></div>',

    iconSize:

    [22, 22],

    iconAnchor:

    [11, 11]

  });

}

/* =====================================================

   ADD MAP MARKER

===================================================== */

function addMarker(find) {

  if (

    find.lat === undefined ||

    find.lng === undefined

  ) {

    return null;

  }

  const lat =

  Number(find.lat);

  const lng =

  Number(find.lng);

  if (

    !Number.isFinite(lat) ||

    !Number.isFinite(lng)

  ) {

    return null;

  }

  const marker =

  L.marker(

    [lat, lng],

    {

      icon:

      findIcon(),

      zIndexOffset:

      100

    }

  ).addTo(map);

  marker.on(

    "click",

    function() {

      openFind(find);

    }

  );

  find.marker =

  marker;

  return marker;

}

/* =====================================================

   START MAP

===================================================== */

function startMap() {

  map =

  L.map("map");

  L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

      attribution:

      "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"

    }

  ).addTo(map);

  finds.forEach(

    function(find) {

      addMarker(find);

    }

  );

  /* GPS */

  if (

    navigator.geolocation

  ) {

    navigator.geolocation.watchPosition(

      function(position) {

        currentLocation = [

          position.coords.latitude,

          position.coords.longitude

        ];

        if (

          !window.locationMarker

        ) {

          window.locationMarker =

          L.circleMarker(

            currentLocation,

            {

              radius: 8,

              color: "white",

              fillColor:

              "#147ef5",

              fillOpacity: 1

            }

          ).addTo(map);

          map.setView(

            currentLocation,

            17

          );

        }

        else {

          window.locationMarker

          .setLatLng(

            currentLocation

          );

        }

      },

      function(error) {

        console.log(

          "GPS error:",

          error.message

        );

      },

      {

        enableHighAccuracy:

        true,

        maximumAge:

        10000,

        timeout:

        15000

      }

    );

  }

  /* =================================================

     MAP CLICK

  ================================================= */

  map.on(

    "click",

    function(event) {

      if (!placingFind) {

        return;

      }

      const lat =

      event.latlng.lat;

      const lng =

      event.latlng.lng;

      selectedLocation = {

        lat:

        lat,

        lng:

        lng

      };

      if (temporaryMarker) {

        map.removeLayer(

          temporaryMarker

        );

      }

      temporaryMarker =

      L.marker(

        [lat, lng],

        {

          icon:

          findIcon(),

          zIndexOffset:

          10000,

          interactive:

          false

        }

      ).addTo(map);

      placingFind =

      false;

      document.getElementById(

        "placeMessage"

      ).style.display =

      "none";

      document.getElementById(

        "map"

      ).style.cursor =

      "";

      openNewFind(

        lat,

        lng

      );

    }

  );

}

/* =====================================================

   OPEN NEW FIND

===================================================== */

function openNewFind(

  lat,

  lng

) {

  editingFind =

  null;

  pendingPhoto =

  null;

  selectedLocation = {

    lat:

    Number(lat),

    lng:

    Number(lng)

  };

  document.getElementById(

    "title"

  ).innerText =

  "New Find";

  document.getElementById(

    "findNumber"

  ).innerText =

  "Find #" +

  nextFindNumber();

  document.getElementById(

    "positionInfo"

  ).innerText =

  "Position recorded\n" +

  "Latitude: " +

  Number(lat).toFixed(7) +

  "\nLongitude: " +

  Number(lng).toFixed(7);

  document.getElementById(

    "find"

  ).value =

  "";

  document.getElementById(

    "material"

  ).value =

  "";

  document.getElementById(

    "era"

  ).value =

  "";

  document.getElementById(

    "remarks"

  ).value =

  "";

  document.getElementById(

    "recorded"

  ).innerText =

  "Recorded: " +

  formatDate(

    new Date()

  );

  const preview =

  document.getElementById(

    "photoPreview"

  );

  preview.src =

  "";

  preview.style.display =

  "none";

  document.getElementById(

    "cameraInput"

  ).value =

  "";

  document.getElementById(

    "libraryInput"

  ).value =

  "";

  document.getElementById(

    "deleteFind"

  ).style.display =

  "none";

  document.getElementById(

    "form"

  ).style.display =

  "block";

}

/* =====================================================

   NORMAL GPS FIND

===================================================== */

document.getElementById(

"findButton"

).onclick =

function() {

  if (!currentLocation) {

    alert(

      "Waiting for GPS location..."

    );

    return;

  }

  openNewFind(

    currentLocation[0],

    currentLocation[1]

  );

};

/* =====================================================

   PLACE FIND BUTTON

===================================================== */

document.getElementById(

"placeFindButton"

).onclick =

function() {

  placingFind =

  true;

  selectedLocation =

  null;

  document.getElementById(

    "placeMessage"

  ).style.display =

  "block";

  document.getElementById(

    "map"

  ).style.cursor =

  "crosshair";

};

/* =====================================================

   CANCEL PLACE

===================================================== */

document.getElementById(

"cancelPlace"

).onclick =

function() {

  placingFind =

  false;

  selectedLocation =

  null;

  document.getElementById(

    "placeMessage"

  ).style.display =

  "none";

  document.getElementById(

    "map"

  ).style.cursor =

  "";

  if (temporaryMarker) {

    map.removeLayer(

      temporaryMarker

    );

    temporaryMarker =

    null;

  }

};

/* =====================================================

   OPEN EXISTING FIND

===================================================== */

function openFind(find) {

  editingFind =

  find;

  pendingPhoto =

  null;

  selectedLocation = {

    lat:

    Number(find.lat),

    lng:

    Number(find.lng)

  };

  document.getElementById(

    "title"

  ).innerText =

  "Edit Find";

  document.getElementById(

    "findNumber"

  ).innerText =

  "Find #" +

  (find.number || "unknown");

  document.getElementById(

    "positionInfo"

  ).innerText =

  "Saved position\n" +

  "Latitude: " +

  Number(find.lat).toFixed(7) +

  "\nLongitude: " +

  Number(find.lng).toFixed(7);

  document.getElementById(

    "find"

  ).value =

  find.find || "";

  document.getElementById(

    "material"

  ).value =

  find.material || "";

  document.getElementById(

    "era"

  ).value =

  find.era || "";

  document.getElementById(

    "remarks"

  ).value =

  find.remarks || "";

  document.getElementById(

    "recorded"

  ).innerText =

  find.recorded

  ?

  "Recorded: " +

  find.recorded

  :

  "";

  const preview =

  document.getElementById(

    "photoPreview"

  );

  if (find.photo) {

    preview.src =

    find.photo;

    preview.style.display =

    "block";

  }

  else {

    preview.src =

    "";

    preview.style.display =

    "none";

  }

  document.getElementById(

    "deleteFind"

  ).style.display =

  "block";

  document.getElementById(

    "form"

  ).style.display =

  "block";

}

/* =====================================================

   SAVE FIND

===================================================== */

async function saveFind() {

  const saveButton =

  document.getElementById(

    "save"

  );

  /* Prevent double tapping */

  saveButton.disabled =

  true;

  saveButton.innerText =

  "SAVING...";

  try {

    /* -----------------------------------------------

       CHECK POSITION

    ----------------------------------------------- */

    if (!selectedLocation) {

      alert(

        "No position has been selected."

      );

      return;

    }

    const lat =

    Number(

      selectedLocation.lat

    );

    const lng =

    Number(

      selectedLocation.lng

    );

    if (

      !Number.isFinite(lat) ||

      !Number.isFinite(lng)

    ) {

      alert(

        "The position is not valid."

      );

      return;

    }

    /* -----------------------------------------------

       READ FORM

    ----------------------------------------------- */

    const findText =

    document.getElementById(

      "find"

    ).value.trim();

    const material =

    document.getElementById(

      "material"

    ).value.trim();

    const era =

    document.getElementById(

      "era"

    ).value.trim();

    const remarks =

    document.getElementById(

      "remarks"

    ).value.trim();

    /* -----------------------------------------------

       EDIT EXISTING FIND

    ----------------------------------------------- */

    if (editingFind) {

      editingFind.find =

      findText;

      editingFind.material =

      material;

      editingFind.era =

      era;

      editingFind.remarks =

      remarks;

      if (pendingPhoto) {

        editingFind.photo =

        pendingPhoto;

      }

      await updateFindInDatabase(

        editingFind

      );

      /* Ensure marker exists */

      if (

        !editingFind.marker

      ) {

        addMarker(

          editingFind

        );

      }

    }

    /* -----------------------------------------------

       NEW FIND

    ----------------------------------------------- */

    else {

      const newFind = {

        number:

        nextFindNumber(),

        find:

        findText,

        material:

        material,

        era:

        era,

        remarks:

        remarks,

        lat:

        lat,

        lng:

        lng,

        recorded:

        formatDate(

          new Date()

        ),

        photo:

        pendingPhoto || null

      };

      const savedFind =

      await addFindToDatabase(

        newFind

      );

      finds.push(

        savedFind

      );

      /* Remove temporary marker */

      if (temporaryMarker) {

        map.removeLayer(

          temporaryMarker

        );

        temporaryMarker =

        null;

      }

      /* Add permanent blue dot */

      addMarker(

        savedFind

      );

    }

    /* -----------------------------------------------

       CLOSE FORM

    ----------------------------------------------- */

    document.getElementById(

      "form"

    ).style.display =

    "none";

    document.getElementById(

      "findsPanel"

    ).style.display =

    "none";

    document.getElementById(

      "placeMessage"

    ).style.display =

    "none";

    /* -----------------------------------------------

       RESET

    ----------------------------------------------- */

    editingFind =

    null;

    pendingPhoto =

    null;

    selectedLocation =

    null;

    placingFind =

    false;

    document.getElementById(

      "map"

    ).style.cursor =

    "";

    updateFindList();

  }

  catch(error) {

    console.error(

      "SAVE ERROR:",

      error

    );

    alert(

      "The find could not be saved.\n\nPlease try again."

    );

  }

  finally {

    saveButton.disabled =

    false;

    saveButton.innerText =

    "SAVE";

  }

}

/* =====================================================

   SAVE BUTTON

===================================================== */

document.getElementById(

"save"

).addEventListener(

"click",

function(event) {

  event.preventDefault();

  event.stopPropagation();

  saveFind();

}

);

/* =====================================================

   CANCEL FORM

===================================================== */

document.getElementById(

"cancel"

).onclick =

function() {

  document.getElementById(

    "form"

  ).style.display =

  "none";

  editingFind =

  null;

  pendingPhoto =

  null;

  selectedLocation =

  null;

  placingFind =

  false;

  document.getElementById(

    "map"

  ).style.cursor =

  "";

  if (temporaryMarker) {

    map.removeLayer(

      temporaryMarker

    );

    temporaryMarker =

    null;

  }

};

/* =====================================================

   DELETE FIND

===================================================== */

document.getElementById(

"deleteFind"

).onclick =

async function() {

  if (!editingFind) {

    return;

  }

  const number =

  editingFind.number || "";

  if (

    !confirm(

      "Delete Find #" +

      number +

      "?\n\n" +

      "This cannot be undone unless you have a backup."

    )

  ) {

    return;

  }

  try {

    await deleteFindFromDatabase(

      editingFind

    );

    if (

      editingFind.marker

    ) {

      map.removeLayer(

        editingFind.marker

      );

    }

    const index =

    finds.indexOf(

      editingFind

    );

    if (index !== -1) {

      finds.splice(

        index,

        1

      );

    }

    editingFind =

    null;

    pendingPhoto =

    null;

    selectedLocation =

    null;

    document.getElementById(

      "form"

    ).style.display =

    "none";

    document.getElementById(

      "findsPanel"

    ).style.display =

    "none";

    updateFindList();

  }

  catch(error) {

    console.error(

      "DELETE ERROR:",

      error

    );

    alert(

      "The find could not be deleted."

    );

  }

};

/* =====================================================

   FIND LIST

===================================================== */

function updateFindList() {

  const list =

  document.getElementById(

    "findList"

  );

  list.innerHTML =

  "";

  if (finds.length === 0) {

    list.innerHTML =

    '<div id="noFinds">No finds recorded yet.</div>';

    return;

  }

  const sortedFinds =

  [...finds].sort(

    function(a, b) {

      return (

        Number(a.number || 0) -

        Number(b.number || 0)

      );

    }

  );

  sortedFinds.forEach(

    function(find) {

      const item =

      document.createElement(

        "div"

      );

      item.className =

      "findItem";

      const title =

      document.createElement(

        "strong"

      );

      title.innerText =

      "Find #" +

      (find.number || "");

      if (find.find) {

        title.innerText +=

        " — " +

        find.find;

      }

      const details =

      document.createElement(

        "small"

      );

      let detailText =

      "";

      if (find.material) {

        detailText +=

        find.material;

      }

      if (find.era) {

        if (detailText) {

          detailText +=

          " · ";

        }

        detailText +=

        find.era;

      }

      if (find.photo) {

        if (detailText) {

          detailText +=

          " · ";

        }

        detailText +=

        "📷 Photo";

      }

      details.innerText =

      detailText;

      item.appendChild(

        title

      );

      item.appendChild(

        details

      );

      item.onclick =

      function() {

        document.getElementById(

          "findsPanel"

        ).style.display =

        "none";

        map.setView(

          [

            Number(find.lat),

            Number(find.lng)

          ],

          19

        );

        openFind(find);

      };

      list.appendChild(

        item

      );

    }

  );

}

/* =====================================================

   FINDS BUTTON

===================================================== */

document.getElementById(

"findsButton"

).onclick =

function() {

  updateFindList();

  document.getElementById(

    "findsPanel"

  ).style.display =

  "block";

};

/* =====================================================

   CLOSE FINDS

===================================================== */

document.getElementById(

"closeFinds"

).onclick =

function() {

  document.getElementById(

    "findsPanel"

  ).style.display =

  "none";

};

/* =====================================================

   BACKUP

===================================================== */

document.getElementById(

"backupButton"

).onclick =

async function() {

  if (finds.length === 0) {

    alert(

      "There are no finds to back up yet."

    );

    return;

  }

  const backupData = {

    app:

    "Find Mapper",

    version:

    2,

    backupDate:

    new Date().toISOString(),

    finds:

    finds.map(

      function(find) {

        return {

          number:

          find.number || null,

          find:

          find.find || "",

          material:

          find.material || "",

          era:

          find.era || "",

          remarks:

          find.remarks || "",

          lat:

          find.lat || null,

          lng:

          find.lng || null,

          recorded:

          find.recorded || "",

          photo:

          find.photo || null

        };

      }

    )

  };

  const json =

  JSON.stringify(

    backupData,

    null,

    2

  );

  const today =

  new Date()

  .toISOString()

  .slice(0, 10);

  const filename =

  "FindMapper_Backup_" +

  today +

  ".json";

  try {

    if (

      navigator.share &&

      navigator.canShare

    ) {

      const file =

      new File(

        [json],

        filename,

        {

          type:

          "application/json"

        }

      );

      if (

        navigator.canShare({

          files:

          [file]

        })

      ) {

        await navigator.share({

          files:

          [file],

          title:

          "Find Mapper Backup",

          text:

          "Backup of my Find Mapper records."

        });

        return;

      }

    }

  }

  catch(error) {

    if (

      error.name ===

      "AbortError"

    ) {

      return;

    }

  }

  const blob =

  new Blob(

    [json],

    {

      type:

      "application/json"

    }

  );

  const url =

  URL.createObjectURL(

    blob

  );

  const link =

  document.createElement(

    "a"

  );

  link.href =

  url;

  link.download =

  filename;

  document.body.appendChild(

    link

  );

  link.click();

  document.body.removeChild(

    link

  );

  setTimeout(

    function() {

      URL.revokeObjectURL(

        url

      );

    },

    1000

  );

};

/* =====================================================

   CSV EXPORT

===================================================== */

document.getElementById(

"csvButton"

).onclick =

async function() {

  if (finds.length === 0) {

    alert(

      "There are no finds to export yet."

    );

    return;

  }

  function csvValue(value) {

    if (

      value === null ||

      value === undefined

    ) {

      value =

      "";

    }

    return (

      '"' +

      String(value)

      .replace(

        /"/g,

        '""'

      ) +

      '"'

    );

  }

  let csv =

  "\uFEFF";

  csv +=

  "Find Number,Find,Material,Date / Era,Remarks,Latitude,Longitude,Recorded\n";

  finds.forEach(

    function(find) {

      csv +=

      csvValue(

        find.number

      ) + "," +

      csvValue(

        find.find

      ) + "," +

      csvValue(

        find.material

      ) + "," +

      csvValue(

        find.era

      ) + "," +

      csvValue(

        find.remarks

      ) + "," +

      csvValue(

        find.lat

      ) + "," +

      csvValue(

        find.lng

      ) + "," +

      csvValue(

        find.recorded

      ) +

      "\n";

    }

  );

  const today =

  new Date()

  .toISOString()

  .slice(0, 10);

  const filename =

  "FindMapper_Finds_" +

  today +

  ".csv";

  try {

    if (

      navigator.share &&

      navigator.canShare

    ) {

      const file =

      new File(

        [csv],

        filename,

        {

          type:

          "text/csv"

        }

      );

      if (

        navigator.canShare({

          files:

          [file]

        })

      ) {

        await navigator.share({

          files:

          [file],

          title:

          "Find Mapper CSV Export",

          text:

          "Export of my Find Mapper records."

        });

        return;

      }

    }

  }

  catch(error) {

    if (

      error.name ===

      "AbortError"

    ) {

      return;

    }

  }

  const blob =

  new Blob(

    [csv],

    {

      type:

      "text/csv;charset=utf-8;"

    }

  );

  const url =

  URL.createObjectURL(

    blob

  );

  const link =

  document.createElement(

    "a"

  );

  link.href =

  url;

  link.download =

  filename;

  document.body.appendChild(

    link

  );

  link.click();

  document.body.removeChild(

    link

  );

  setTimeout(

    function() {

      URL.revokeObjectURL(

        url

      );

    },

    1000

  );

};

/* =====================================================

   START APPLICATION

===================================================== */

async function startApplication() {

  try {

    await openDatabase();

    await migrateOldFinds();

    await loadFinds();

    startMap();

    updateFindList();

  }

  catch(error) {

    console.error(

      "DATABASE ERROR:",

      error

    );

    alert(

      "Find Mapper could not open its storage.\n\nPlease reload the app and try again."

    );

  }

}

startApplication();

</script>
