<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Mapper</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eee;
}

#map {
  height: 100vh;
  width: 100%;
}

#findButton {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: #147ef5;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 16px 30px;
  font-size: 20px;
  font-weight: bold;
}

#form {
  display: none;
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  z-index: 2000;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 2px 15px #555;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  box-sizing: border-box;
  font-size: 17px;
}

button {
  padding: 12px;
  font-size: 17px;
  border-radius: 10px;
  border: none;
}

#save {
  background: #147ef5;
  color: white;
}

#cancel {
  background: #ddd;
}
</style>
</head>

<body>

<div id="map"></div>

<button id="findButton">＋ FIND</button>

<div id="form">

<h2 id="title">New Find</h2>

<label>Find</label>
<input id="find">

<label>Material</label>
<input id="material">

<label>Date / Era</label>
<input id="era">

<button id="save">SAVE</button>
<button id="cancel">CANCEL</button>

</div>

<script>

let map;
let currentLocation;
let selectedMarker = null;

let finds =
JSON.parse(localStorage.getItem("finds") || "[]");

function startMap() {

  map = L.map("map").setView([51.35,0.75],16);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

  finds.forEach(addMarker);

  if (navigator.geolocation) {

    navigator.geolocation.watchPosition(
      function(position) {

        currentLocation = [
          position.coords.latitude,
          position.coords.longitude
        ];

        map.setView(currentLocation,17);

        if (!window.locationMarker) {

          window.locationMarker =
            L.circleMarker(currentLocation,{
              radius:8,
              color:"white",
              fillColor:"#147ef5",
              fillOpacity:1
            }).addTo(map);

        } else {

          window.locationMarker
            .setLatLng(currentLocation);

        }

      }
    );

  }
}

function addMarker(find) {

  let marker =
    L.circleMarker(
      [find.lat,find.lng],
      {
        radius:7,
        color:"white",
        fillColor:"#147ef5",
        fillOpacity:1
      }
    ).addTo(map);

  marker.on("click",function(){

    selectedMarker = marker;

    document.getElementById("title")
      .innerText="Edit Find";

    document.getElementById("find")
      .value=find.find;

    document.getElementById("material")
      .value=find.material;

    document.getElementById("era")
      .value=find.era;

    document.getElementById("form")
      .style.display="block";

    window.editingFind=find;

  });

}

document.getElementById("findButton")
.onclick=function(){

  if(!currentLocation){

    alert("Waiting for GPS location...");
    return;
  }

  window.editingFind=null;

  document.getElementById("title")
    .innerText="New Find";

  document.getElementById("find").value="";
  document.getElementById("material").value="";
  document.getElementById("era").value="";

  document.getElementById("form")
    .style.display="block";

};

document.getElementById("cancel")
.onclick=function(){

  document.getElementById("form")
    .style.display="none";

};

document.getElementById("save")
.onclick=function(){

  if(window.editingFind){

    window.editingFind.find =
      document.getElementById("find").value;

    window.editingFind.material =
      document.getElementById("material").value;

    window.editingFind.era =
      document.getElementById("era").value;

  } else {

    let newFind={

      find:document.getElementById("find").value,

      material:
        document.getElementById("material").value,

      era:
        document.getElementById("era").value,

      lat:currentLocation[0],

      lng:currentLocation[1]

    };

    finds.push(newFind);

    addMarker(newFind);

  }

  localStorage.setItem(
    "finds",
    JSON.stringify(finds)
  );

  document.getElementById("form")
    .style.display="none";

};

</script>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script>
startMap();
</script>

</body>
</html>
