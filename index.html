<script>

let map;

let currentLocation;

let editingFind = null;

let pendingPhoto = null;

let finds =

JSON.parse(

localStorage.getItem("finds") || "[]"

);

/* -------------------------

   FIND NUMBER

------------------------- */

function nextFindNumber() {

  let highest = 0;

  finds.forEach(function(find) {

    if (

      find.number &&

      Number(find.number) > highest

    ) {

      highest = Number(find.number);

    }

  });

  return highest + 1;

}

/* -------------------------

   DATE

------------------------- */

function formatDate(date) {

  return date.toLocaleString(

    "en-GB",

    {

      day: "2-digit",

      month: "2-digit",

      year: "numeric",

      hour: "2-digit",

      minute: "2-digit"

    }

  );

}

/* -------------------------

   PHOTO

------------------------- */

function compressPhoto(file) {

  return new Promise(function(resolve) {

    const reader = new FileReader();

    reader.onload = function(event) {

      const img = new Image();

      img.onload = function() {

        const maxSize = 1200;

        let width = img.width;

        let height = img.height;

        if (width > height) {

          if (width > maxSize) {

            height =

            height * maxSize / width;

            width = maxSize;

          }

        }

        else {

          if (height > maxSize) {

            width =

            width * maxSize / height;

            height = maxSize;

          }

        }

        const canvas =

        document.createElement("canvas");

        canvas.width = width;

        canvas.height = height;

        const ctx =

        canvas.getContext("2d");

        ctx.drawImage(

          img,

          0,

          0,

          width,

          height

        );

        resolve(

          canvas.toDataURL(

            "image/jpeg",

            0.75

          )

        );

      };

      img.src = event.target.result;

    };

    reader.readAsDataURL(file);

  });

}

function handlePhoto(file) {

  if (!file) return;

  compressPhoto(file)

  .then(function(photo) {

    pendingPhoto = photo;

    const preview =

    document.getElementById(

      "photoPreview"

    );

    preview.src = photo;

    preview.style.display = "block";

  });

}

document.getElementById(

"cameraInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

document.getElementById(

"libraryInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

/* -------------------------

   MAP

------------------------- */

function startMap() {

  map =

  L.map("map");

  L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

      attribution:

      "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"

    }

  ).addTo(map);
