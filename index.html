<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Mapper</title>

<link rel="stylesheet"

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  font-family: Arial, sans-serif;

}

#map {

  width: 100%;

  height: 100%;

}

button {

  border: none;

  border-radius: 10px;

  padding: 12px 16px;

  font-size: 16px;

  font-weight: bold;

}

#findButton {

  position: fixed;

  bottom: 25px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 1000;

  background: #147ef5;

  color: white;

  padding: 16px 30px;

  border-radius: 30px;

  font-size: 20px;

}

#findsButton {

  position: fixed;

  top: 15px;

  right: 15px;

  z-index: 1000;

  background: white;

  box-shadow: 0 2px 8px #555;

}

#form,

#findsPanel {

  display: none;

  position: fixed;

  z-index: 2000;

  background: white;

  box-shadow: 0 2px 15px #555;

  border-radius: 18px;

}

#form {

  left: 10px;

  right: 10px;

  bottom: 10px;

  padding: 20px;

  max-height: 90vh;

  overflow-y: auto;

}

#findsPanel {

  top: 10px;

  left: 10px;

  right: 10px;

  bottom: 10px;

  padding: 20px;

  overflow-y: auto;

}

#findsPanel h2 {

  margin-top: 0;

}

#closeFinds {

  float: right;

  background: #ddd;

}

#backupButton {

  width: 100%;

  background: #34c759;

  color: white;

  margin-top: 20px;

  padding: 15px;

  font-size: 17px;

}

#csvButton {

  width: 100%;

  background: #147ef5;

  color: white;

  margin-top: 10px;

  padding: 15px;

  font-size: 17px;

}

#deleteFind {

  width: 100%;

  background: #ff3b30;

  color: white;

  margin-top: 20px;

  padding: 15px;

  font-size: 17px;

}

#title {

  margin-top: 0;

}

#findNumber {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 15px;

}

label {

  display: block;

  font-weight: bold;

  margin-top: 10px;

}

input,

textarea {

  width: 100%;

  box-sizing: border-box;

  padding: 12px;

  margin-top: 6px;

  margin-bottom: 10px;

  font-size: 17px;

  border: 1px solid #bbb;

  border-radius: 8px;

}

textarea {

  min-height: 100px;

}

#recorded {

  font-size: 14px;

  color: #666;

  margin-bottom: 15px;

}

#save {

  background: #147ef5;

  color: white;

}

#cancel {

  background: #ddd;

}

#photoButtons {

  display: flex;

  gap: 8px;

}

.photoButton {

  flex: 1;

  background: #eee;

  padding: 12px;

  border-radius: 10px;

  text-align: center;

  font-size: 16px;

  cursor: pointer;

}

#cameraInput,

#libraryInput {

  display: none;

}

#photoPreview {

  display: none;

  width: 100%;

  max-height: 300px;

  object-fit: contain;

  margin-top: 10px;

  border-radius: 10px;

}

.findItem {

  padding: 15px 5px;

  border-bottom: 1px solid #ddd;

  cursor: pointer;

}

.findItem strong {

  font-size: 18px;

}

.findItem small {

  display: block;

  color: #666;

  margin-top: 5px;

}

.findItem:hover {

  background: #f5f5f5;

}

#noFinds {

  color: #666;

  padding: 20px 0;

}

</style>

</head>

<body>

<div id="map"></div>

<button id="findsButton">

☰ FINDS

</button>

<button id="findButton">

＋ FIND

</button>

<!-- FIND RECORD -->

<div id="form">

<h2 id="title">

New Find

</h2>

<div id="findNumber"></div>

<label>Find</label>

<input id="find" autocomplete="off">

<label>Material</label>

<input id="material" autocomplete="off">

<label>Date / Era</label>

<input id="era" autocomplete="off">

<label>Remarks</label>

<textarea

id="remarks"

placeholder="Enter any additional information..."></textarea>

<label>Photo</label>

<div id="photoButtons">

<label

for="cameraInput"

class="photoButton">

📷 Take Photo

</label>

<label

for="libraryInput"

class="photoButton">

🖼️ Choose Photo

</label>

</div>

<input

type="file"

id="cameraInput"

accept="image/*"

capture="environment">

<input

type="file"

id="libraryInput"

accept="image/*">

<img

id="photoPreview">

<div id="recorded"></div>

<button id="save">

SAVE

</button>

<button id="cancel">

CANCEL

</button>

<button id="deleteFind">

🗑️ DELETE FIND

</button>

</div>

<!-- FINDS LIST -->

<div id="findsPanel">

<button id="closeFinds">

CLOSE

</button>

<h2>

My Finds

</h2>

<div id="findList"></div>

<button id="backupButton">

💾 BACKUP / EXPORT FINDS

</button>

<button id="csvButton">

📊 EXPORT TO CSV

</button>

</div>

<script

src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

</script>

<script>

let map;

let currentLocation;

let editingFind = null;

let pendingPhoto = null;

let finds =

JSON.parse(

localStorage.getItem("finds") || "[]"

);

/* -------------------------

   FIND NUMBER

------------------------- */

function nextFindNumber() {

  let highest = 0;

  finds.forEach(function(find) {

    if (

      find.number &&

      Number(find.number) > highest

    ) {

      highest =

      Number(find.number);

    }

  });

  return highest + 1;

}

/* -------------------------

   DATE

------------------------- */

function formatDate(date) {

  return date.toLocaleString(

    "en-GB",

    {

      day: "2-digit",

      month: "2-digit",

      year: "numeric",

      hour: "2-digit",

      minute: "2-digit"

    }

  );

}

/* -------------------------

   PHOTO

------------------------- */

function compressPhoto(file) {

  return new Promise(function(resolve) {

    const reader =

    new FileReader();

    reader.onload =

    function(event) {

      const img =

      new Image();

      img.onload =

      function() {

        const maxSize = 1200;

        let width =

        img.width;

        let height =

        img.height;

        if (width > height) {

          if (width > maxSize) {

            height =

            height * maxSize / width;

            width =

            maxSize;

          }

        }

        else {

          if (height > maxSize) {

            width =

            width * maxSize / height;

            height =

            maxSize;

          }

        }

        const canvas =

        document.createElement(

          "canvas"

        );

        canvas.width =

        width;

        canvas.height =

        height;

        const ctx =

        canvas.getContext(

          "2d"

        );

        ctx.drawImage(

          img,

          0,

          0,

          width,

          height

        );

        resolve(

          canvas.toDataURL(

            "image/jpeg",

            0.75

          )

        );

      };

      img.src =

      event.target.result;

    };

    reader.readAsDataURL(file);

  });

}

function handlePhoto(file) {

  if (!file) return;

  compressPhoto(file)

  .then(function(photo) {

    pendingPhoto =

    photo;

    const preview =

    document.getElementById(

      "photoPreview"

    );

    preview.src =

    photo;

    preview.style.display =

    "block";

  });

}

document.getElementById(

"cameraInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

document.getElementById(

"libraryInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

/* -------------------------

   MAP

------------------------- */

function startMap() {

  map =

  L.map("map");

  L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

      attribution:

      "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"

    }

  ).addTo(map);

  finds.forEach(

    addMarker

  );

  if (

    navigator.geolocation

  ) {

    navigator.geolocation.watchPosition(

      function(position) {

        currentLocation = [

          position.coords.latitude,

          position.coords.longitude

        ];

        if (

          !window.locationMarker

        ) {

          window.locationMarker =

          L.circleMarker(

            currentLocation,

            {

              radius: 8,

              color: "white",

              fillColor: "#147ef5",

              fillOpacity: 1

            }

          ).addTo(map);

          map.setView(

            currentLocation,

            17

          );

        }

        else {

          window.locationMarker

          .setLatLng(

            currentLocation

          );

        }

      },

      function() {

        alert(

          "Location access is needed to record a find."

        );

      },

      {

        enableHighAccuracy: true,

        maximumAge: 10000,

        timeout: 15000

      }

    );

  }

}

/* -------------------------

   MAP MARKER

------------------------- */

function addMarker(find) {

  const marker =

  L.circleMarker(

    [

      find.lat,

      find.lng

    ],

    {

      radius: 7,

      color: "white",

      fillColor: "#147ef5",

      fillOpacity: 1

    }

  ).addTo(map);

  marker.on(

    "click",

    function() {

      openFind(find);

    }

  );

  find.marker =

  marker;

}

/* -------------------------

   OPEN FIND

------------------------- */

function openFind(find) {

  editingFind =

  find;

  pendingPhoto =

  null;

  document.getElementById(

    "title"

  ).innerText =

  "Edit Find";

  document.getElementById(

    "findNumber"

  ).innerText =

  "Find #" +

  (find.number || "unknown");

  document.getElementById(

    "find"

  ).value =

  find.find || "";

  document.getElementById(

    "material"

  ).value =

  find.material || "";

  document.getElementById(

    "era"

  ).value =

  find.era || "";

  document.getElementById(

    "remarks"

  ).value =

  find.remarks || "";

  document.getElementById(

    "recorded"

  ).innerText =

  find.recorded

  ?

  "Recorded: " +

  find.recorded

  :

  "";

  const preview =

  document.getElementById(

    "photoPreview"

  );

  if (find.photo) {

    preview.src =

    find.photo;

    preview.style.display =

    "block";

  }

  else {

    preview.src = "";

    preview.style.display =

    "none";

  }

  document.getElementById(

    "deleteFind"

  ).style.display =

  "block";

  document.getElementById(

    "form"

  ).style.display =

  "block";

}

/* -------------------------

   NEW FIND

------------------------- */

document.getElementById(

"findButton"

).onclick =

function() {

  if (!currentLocation) {

    alert(

      "Waiting for GPS location..."

    );

    return;

  }

  editingFind =

  null;

  pendingPhoto =

  null;

  const number =

  nextFindNumber();

  document.getElementById(

    "title"

  ).innerText =

  "New Find";

  document.getElementById(

    "findNumber"

  ).innerText =

  "Find #" +

  number;

  document.getElementById(

    "find"

  ).value = "";

  document.getElementById(

    "material"

  ).value = "";

  document.getElementById(

    "era"

  ).value = "";

  document.getElementById(

    "remarks"

  ).value = "";

  document.getElementById(

    "recorded"

  ).innerText =

  "Recorded: " +

  formatDate(

    new Date()

  );

  const preview =

  document.getElementById(

    "photoPreview"

  );

  preview.src = "";

  preview.style.display =

  "none";

  document.getElementById(

    "cameraInput"

  ).value = "";

  document.getElementById(

    "libraryInput"

  ).value = "";

  document.getElementById(

    "deleteFind"

  ).style.display =

  "none";

  document.getElementById(

    "form"

  ).style.display =

  "block";

};

/* -------------------------

   SAVE

------------------------- */

document.getElementById(

"save"

).onclick =

function() {

  if (editingFind) {

    editingFind.find =

    document.getElementById(

      "find"

    ).value;

    editingFind.material =

    document.getElementById(

      "material"

    ).value;

    editingFind.era =

    document.getElementById(

      "era"

    ).value;

    editingFind.remarks =

    document.getElementById(

      "remarks"

    ).value;

    if (pendingPhoto) {

      editingFind.photo =

      pendingPhoto;

    }

    localStorage.setItem(

      "finds",

      JSON.stringify(finds)

    );

  }

  else {

    const newFind = {

      number:

      nextFindNumber(),

      find:

      document.getElementById(

        "find"

      ).value,

      material:

      document.getElementById(

        "material"

      ).value,

      era:

      document.getElementById(

        "era"

      ).value,

      remarks:

      document.getElementById(

        "remarks"

      ).value,

      lat:

      currentLocation[0],

      lng:

      currentLocation[1],

      recorded:

      formatDate(

        new Date()

      ),

      photo:

      pendingPhoto || null

    };

    finds.push(

      newFind

    );

    localStorage.setItem(

      "finds",

      JSON.stringify(finds)

    );

    addMarker(

      newFind

    );

  }

  document.getElementById(

    "form"

  ).style.display =

  "none";

  pendingPhoto =

  null;

  editingFind =

  null;

  updateFindList();

};

/* -------------------------

   DELETE FIND

------------------------- */

document.getElementById(

"deleteFind"

).onclick =

function() {

  if (!editingFind) {

    return;

  }

  const number =

  editingFind.number ||

  "unknown";

  const confirmed =

  confirm(

    "Delete Find #" +

    number +

    "?\n\nThis cannot be undone unless you have a backup."

  );

  if (!confirmed) {

    return;

  }

  if (editingFind.marker) {

    map.removeLayer(

      editingFind.marker

    );

  }

  const index =

  finds.indexOf(

    editingFind

  );

  if (index !== -1) {

    finds.splice(

      index,

      1

    );

  }

  localStorage.setItem(

    "finds",

    JSON.stringify(finds)

  );

  editingFind =

  null;

  pendingPhoto =

  null;

  document.getElementById(

    "form"

  ).style.display =

  "none";

  updateFindList();

};

/* -------------------------

   CANCEL

------------------------- */

document.getElementById(

"cancel"

).onclick =

function() {

  document.getElementById(

    "form"

  ).style.display =

  "none";

  pendingPhoto =

  null;

  editingFind =

  null;

};

/* -------------------------

   FINDS LIST

------------------------- */

function updateFindList() {

  const list =

  document.getElementById(

    "findList"

  );

  list.innerHTML =

  "";

  if (finds.length === 0) {

    list.innerHTML =

    '<div id="noFinds">No finds recorded yet.</div>';

    return;

  }

  const sortedFinds =

  [...finds].sort(

    function(a, b) {

      return (

        Number(

          a.number || 0

        ) -

        Number(

          b.number || 0

        )

      );

    }

  );

  sortedFinds.forEach(

    function(find) {

      const item =

      document.createElement(

        "div"

      );

      item.className =

      "findItem";

      const title =

      document.createElement(

        "strong"

      );

      title.innerText =

      "Find #" +

      (find.number || "");

      if (find.find) {

        title.innerText +=

        " — " +

        find.find;

      }

      const details =

      document.createElement(

        "small"

      );

      let detailText =

      "";

      if (find.material) {

        detailText +=

        find.material;

      }

      if (find.era) {

        if (detailText) {

          detailText +=

          " · ";

        }

        detailText +=

        find.era;

      }

      if (find.photo) {

        if (detailText) {

          detailText +=

          " · ";

        }

        detailText +=

        "📷 Photo";

      }

      details.innerText =

      detailText;

      item.appendChild(

        title

      );

      item.appendChild(

        details

      );

      item.onclick =

      function() {

        document.getElementById(

          "findsPanel"

        ).style.display =

        "none";

        if (

          find.lat &&

          find.lng

        ) {

          map.setView(

            [

              find.lat,

              find.lng

            ],

            19

          );

        }

        openFind(find);

      };

      list.appendChild(

        item

      );

    }

  );

}

/* -------------------------

   OPEN FINDS

------------------------- */

document.getElementById(

"findsButton"

).onclick =

function() {

  updateFindList();

  document.getElementById(

    "findsPanel"

  ).style.display =

  "block";

};

/* -------------------------

   CLOSE FINDS

------------------------- */

document.getElementById(

"closeFinds"

).onclick =

function() {

  document.getElementById(

    "findsPanel"

  ).style.display =

  "none";

};

/* -------------------------

   JSON BACKUP / EXPORT

------------------------- */

document.getElementById(

"backupButton"

).onclick =

async function() {

  if (finds.length === 0) {

    alert(

      "There are no finds to back up yet."

    );

    return;

  }

  const backupData = {

    app:

    "Find Mapper",

    backupDate:

    new Date().toISOString(),

    finds:

    finds.map(

      function(find) {

        return {

          number:

          find.number || null,

          find:

          find.find || "",

          material:

          find.material || "",

          era:

          find.era || "",

          remarks:

          find.remarks || "",

          lat:

          find.lat || null,

          lng:

          find.lng || null,

          recorded:

          find.recorded || "",

          photo:

          find.photo || null

        };

      }

    )

  };

  const json =

  JSON.stringify(

    backupData,

    null,

    2

  );

  const today =

  new Date()

  .toISOString()

  .slice(0, 10);

  const filename =

  "FindMapper_Backup_" +

  today +

  ".json";

  try {

    if (

      navigator.share &&

      navigator.canShare

    ) {

      const file =

      new File(

        [json],

        filename,

        {

          type:

          "application/json"

        }

      );

      if (

        navigator.canShare({

          files:

          [file]

        })

      ) {

        await navigator.share({

          files:

          [file],

          title:

          "Find Mapper Backup",

          text:

          "Backup of my Find Mapper records."

        });

        return;

      }

    }

  }

  catch (error) {

    if (

      error.name ===

      "AbortError"

    ) {

      return;

    }

  }

  const blob =

  new Blob(

    [json],

    {

      type:

      "application/json"

    }

  );

  const url =

  URL.createObjectURL(

    blob

  );

  const link =

  document.createElement(

    "a"

  );

  link.href =

  url;

  link.download =

  filename;

  document.body.appendChild(

    link

  );

  link.click();

  document.body.removeChild(

    link

  );

  setTimeout(

    function() {

      URL.revokeObjectURL(

        url

      );

    },

    1000

  );

};

/* -------------------------

   CSV EXPORT

------------------------- */

document.getElementById(

"csvButton"

).onclick =

async function() {

  if (finds.length === 0) {

    alert(

      "There are no finds to export yet."

    );

    return;

  }

  function csvValue(value) {

    if (

      value === null ||

      value === undefined

    ) {

      value =

      "";

    }

    value =

    String(value);

    return (

      '"' +

      value.replace(

        /"/g,

        '""'

      ) +

      '"'

    );

  }

  let csv =

  "\uFEFF";

  csv +=

  "Find Number,Find,Material,Date / Era,Remarks,Latitude,Longitude,Recorded\n";

  finds.forEach(

    function(find) {

      csv +=

        csvValue(

          find.number

        ) + "," +

        csvValue(

          find.find

        ) + "," +

        csvValue(

          find.material

        ) + "," +

        csvValue(

          find.era

        ) + "," +

        csvValue(

          find.remarks

        ) + "," +

        csvValue(

          find.lat

        ) + "," +

        csvValue(

          find.lng

        ) + "," +

        csvValue(

          find.recorded

        ) +

        "\n";

    }

  );

  const today =

  new Date()

  .toISOString()

  .slice(0, 10);

  const filename =

  "FindMapper_Finds_" +

  today +

  ".csv";

  try {

    if (

      navigator.share &&

      navigator.canShare

    ) {

      const file =

      new File(

        [csv],

        filename,

        {

          type:

          "text/csv"

        }

      );

      if (

        navigator.canShare({

          files:

          [file]

        })

      ) {

        await navigator.share({

          files:

          [file],

          title:

          "Find Mapper CSV Export",

          text:

          "Export of my Find Mapper records."

        });

        return;

      }

    }

  }

  catch (error) {

    if (

      error.name ===

      "AbortError"

    ) {

      return;

    }

  }

  const blob =

  new Blob(

    [csv],

    {

      type:

      "text/csv;charset=utf-8;"

    }

  );

  const url =

  URL.createObjectURL(

    blob

  );

  const link =

  document.createElement(

    "a"

  );

  link.href =

  url;

  link.download =

  filename;

  document.body.appendChild(

    link

  );

  link.click();

  document.body.removeChild(

    link

  );

  setTimeout(

    function() {

      URL.revokeObjectURL(

        url

      );

    },

    1000

  );

};

/* -------------------------

   START

------------------------- */

startMap();

updateFindList();

</script>

</body>

</html>
