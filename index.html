<script>

/* =====================================================

   DATABASE

===================================================== */

const DB_NAME = "FindMapperDatabase";

const DB_VERSION = 2;

const FIND_STORE = "finds";

const PHOTO_STORE = "photos";

let db = null;

/* =====================================================

   GLOBALS

===================================================== */

let map = null;

let currentLocation = null;

let finds = [];

let editingFind = null;

let selectedLocation = null;

let pendingPhoto = null;

let pendingPhotoRemoved = false;

let placingFind = false;

let temporaryMarker = null;

/* =====================================================

   OPEN DATABASE

===================================================== */

function openDatabase() {

  return new Promise(function(resolve, reject) {

    const request =

    indexedDB.open(

      DB_NAME,

      DB_VERSION

    );

    request.onupgradeneeded =

    function(event) {

      const database =

      event.target.result;

      if (

        !database.objectStoreNames.contains(

          FIND_STORE

        )

      ) {

        database.createObjectStore(

          FIND_STORE,

          {

            keyPath: "id",

            autoIncrement: true

          }

        );

      }

      if (

        !database.objectStoreNames.contains(

          PHOTO_STORE

        )

      ) {

        database.createObjectStore(

          PHOTO_STORE,

          {

            keyPath: "findId"

          }

        );

      }

    };

    request.onsuccess =

    function(event) {

      db =

      event.target.result;

      resolve(db);

    };

    request.onerror =

    function(event) {

      reject(

        event.target.error

      );

    };

  });

}

/* =====================================================

   GET ALL FINDS

===================================================== */

function getAllFinds() {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      FIND_STORE,

      "readonly"

    );

    const store =

    transaction.objectStore(

      FIND_STORE

    );

    const request =

    store.getAll();

    request.onsuccess =

    function() {

      resolve(

        request.result || []

      );

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   ADD FIND

===================================================== */

function addFind(find) {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      FIND_STORE,

      "readwrite"

    );

    const store =

    transaction.objectStore(

      FIND_STORE

    );

    const request =

    store.add(find);

    request.onsuccess =

    function() {

      find.id =

      request.result;

      resolve(find);

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   UPDATE FIND

===================================================== */

function updateFind(find) {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      FIND_STORE,

      "readwrite"

    );

    const store =

    transaction.objectStore(

      FIND_STORE

    );

    const request =

    store.put(find);

    request.onsuccess =

    function() {

      resolve(find);

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   DELETE FIND

===================================================== */

function deleteFind(find) {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      FIND_STORE,

      "readwrite"

    );

    const store =

    transaction.objectStore(

      FIND_STORE

    );

    const request =

    store.delete(find.id);

    request.onsuccess =

    function() {

      resolve();

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   SAVE PHOTO AS BLOB

===================================================== */

function savePhotoBlob(findId, blob) {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      PHOTO_STORE,

      "readwrite"

    );

    const store =

    transaction.objectStore(

      PHOTO_STORE

    );

    const request =

    store.put({

      findId:

      findId,

      blob:

      blob

    });

    request.onsuccess =

    function() {

      resolve();

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   GET PHOTO

===================================================== */

function getPhotoBlob(findId) {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      PHOTO_STORE,

      "readonly"

    );

    const store =

    transaction.objectStore(

      PHOTO_STORE

    );

    const request =

    store.get(findId);

    request.onsuccess =

    function() {

      if (

        request.result

      ) {

        resolve(

          request.result.blob

        );

      }

      else {

        resolve(null);

      }

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   DELETE PHOTO

===================================================== */

function deletePhotoBlob(findId) {

  return new Promise(function(resolve, reject) {

    const transaction =

    db.transaction(

      PHOTO_STORE,

      "readwrite"

    );

    const store =

    transaction.objectStore(

      PHOTO_STORE

    );

    const request =

    store.delete(findId);

    request.onsuccess =

    function() {

      resolve();

    };

    request.onerror =

    function() {

      reject(

        request.error

      );

    };

  });

}

/* =====================================================

   COMPRESS PHOTO TO BLOB

===================================================== */

function compressPhoto(file) {

  return new Promise(function(resolve, reject) {

    const reader =

    new FileReader();

    reader.onload =

    function(event) {

      const img =

      new Image();

      img.onload =

      function() {

        const maxSize = 1200;

        let width =

        img.width;

        let height =

        img.height;

        if (width > height) {

          if (width > maxSize) {

            height =

            height *

            maxSize /

            width;

            width =

            maxSize;

          }

        }

        else {

          if (height > maxSize) {

            width =

            width *

            maxSize /

            height;

            height =

            maxSize;

          }

        }

        const canvas =

        document.createElement(

          "canvas"

        );

        canvas.width =

        width;

        canvas.height =

        height;

        const ctx =

        canvas.getContext(

          "2d"

        );

        ctx.drawImage(

          img,

          0,

          0,

          width,

          height

        );

        canvas.toBlob(

          function(blob) {

            if (!blob) {

              reject(

                new Error(

                  "Photo conversion failed."

                )

              );

              return;

            }

            resolve(blob);

          },

          "image/jpeg",

          0.75

        );

      };

      img.onerror =

      function() {

        reject(

          new Error(

            "Photo could not be opened."

          )

        );

      };

      img.src =

      event.target.result;

    };

    reader.onerror =

    function() {

      reject(

        new Error(

          "Photo could not be read."

        )

      );

    };

    reader.readAsDataURL(file);

  });

}

/* =====================================================

   PHOTO INPUT

===================================================== */

function handlePhoto(file) {

  if (!file) {

    return;

  }

  compressPhoto(file)

  .then(function(blob) {

    pendingPhoto =

    blob;

    pendingPhotoRemoved =

    false;

    const preview =

    document.getElementById(

      "photoPreview"

    );

    preview.src =

    URL.createObjectURL(

      blob

    );

    preview.style.display =

    "block";

    document.getElementById(

      "removePhoto"

    ).style.display =

    "block";

  })

  .catch(function(error) {

    console.error(error);

    alert(

      "The photo could not be processed."

    );

  });

}

document.getElementById(

"cameraInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

document.getElementById(

"libraryInput"

).addEventListener(

"change",

function(event) {

  handlePhoto(

    event.target.files[0]

  );

});

/* =====================================================

   REMOVE PHOTO

===================================================== */

document.getElementById(

"removePhoto"

).onclick =

function() {

  pendingPhoto =

  null;

  pendingPhotoRemoved =

  true;

  const preview =

  document.getElementById(

    "photoPreview"

  );

  preview.src =

  "";

  preview.style.display =

  "none";

  document.getElementById(

    "removePhoto"

  ).style.display =

  "none";

  document.getElementById(

    "cameraInput"

  ).value =

  "";

  document.getElementById(

    "libraryInput"

  ).value =

  "";

};

/* =====================================================

   FIND NUMBER

===================================================== */

function nextFindNumber() {

  let highest = 0;

  finds.forEach(function(find) {

    const number =

    Number(find.number);

    if (

      Number.isFinite(number) &&

      number > highest

    ) {

      highest =

      number;

    }

  });

  return highest + 1;

}

/* =====================================================

   DATE

===================================================== */

function formatDate(date) {

  return date.toLocaleString(

    "en-GB",

    {

      day: "2-digit",

      month: "2-digit",

      year: "numeric",

      hour: "2-digit",

      minute: "2-digit"

    }

  );

}

/* =====================================================

   BLUE DOT

===================================================== */

function findIcon() {

  return L.divIcon({

    className: "",

    html:

    '<div class="find-dot"></div>',

    iconSize:

    [22, 22],

    iconAnchor:

    [11, 11]

  });

}

/* =====================================================

   ADD MARKER

===================================================== */

function addMarker(find) {

  if (

    !Number.isFinite(

      Number(find.lat)

    ) ||

    !Number.isFinite(

      Number(find.lng)

    )

  ) {

    return;

  }

  const marker =

  L.marker(

    [

      Number(find.lat),

      Number(find.lng)

    ],

    {

      icon:

      findIcon(),

      zIndexOffset:

      100

    }

  ).addTo(map);

  marker.on(

    "click",

    function() {

      openFind(find);

    }

  );

  find.marker =

  marker;

}

/* =====================================================

   START MAP

===================================================== */

function startMap() {

  map =

  L.map("map");

  L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

      attribution:

      "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"

    }

  ).addTo(map);

  finds.forEach(

    function(find) {

      addMarker(find);

    }

  );

  if (

    navigator.geolocation

  ) {

    navigator.geolocation.watchPosition(

      function(position) {

        currentLocation = [

          position.coords.latitude,

          position.coords.longitude

        ];

        if (

          !window.locationMarker

        ) {

          window.locationMarker =

          L.circleMarker(

            currentLocation,

            {

              radius: 8,

              color: "white",

              fillColor:

              "#147ef5",

              fillOpacity: 1

            }

          ).addTo(map);

          map.setView(

            currentLocation,

            17

          );

        }

        else {

          window.locationMarker

          .setLatLng(

            currentLocation

          );

        }

      },

      function(error) {

        console.log(

          "GPS:",

          error.message

        );

      },

      {

        enableHighAccuracy:

        true,

        maximumAge:

        10000,

        timeout:

        15000

      }

    );

  }

  /* MAP CLICK FOR PLACE FIND */

  map.on(

    "click",

    function(event) {

      if (!placingFind) {

        return;

      }

      const lat =

      event.latlng.lat;

      const lng =

      event.latlng.lng;

      selectedLocation = {

        lat:

        lat,

        lng:

        lng

      };

      if (temporaryMarker) {

        map.removeLayer(

          temporaryMarker

        );

      }

      temporaryMarker =

      L.marker(

        [lat, lng],

        {

          icon:

          findIcon(),

          interactive:

          false,

          zIndexOffset:

          10000

        }

      ).addTo(map);

      placingFind =

      false;

      document.getElementById(

        "placeMessage"

      ).style.display =

      "none";

      openNewFind(

        lat,

        lng

      );

    }

  );

}

/* =====================================================

   NEW FIND

===================================================== */

function openNewFind(lat, lng) {

  editingFind =

  null;

  pendingPhoto =

  null;

  pendingPhotoRemoved =

  false;

  selectedLocation = {

    lat:

    Number(lat),

    lng:

    Number(lng)

  };

  document.getElementById(

    "title"

  ).innerText =

  "New Find";

  document.getElementById(

    "findNumber"

  ).innerText =

  "Find #" +

  nextFindNumber();

  document.getElementById(

    "positionInfo"

  ).innerText =

  "Position recorded\n" +

  "Latitude: " +

  Number(lat).toFixed(7) +

  "\nLongitude: " +

  Number(lng).toFixed(7);

  document.getElementById(

    "find"

  ).value =

  "";

  document.getElementById(

    "material"

  ).value =

  "";

  document.getElementById(

    "era"

  ).value =

  "";

  document.getElementById(

    "remarks"

  ).value =

  "";

  document.getElementById(

    "recorded"

  ).innerText =

  "Recorded: " +

  formatDate(new Date());

  const preview =

  document.getElementById(

    "photoPreview"

  );

  preview.src =

  "";

  preview.style.display =

  "none";

  document.getElementById(

    "removePhoto"

  ).style.display =

  "none";

  document.getElementById(

    "deleteFind"

  ).style.display =

  "none";

  document.getElementById(

    "cameraInput"

  ).value =

  "";

  document.getElementById(

    "libraryInput"

  ).value =

  "";

  document.getElementById(

    "form"

  ).style.display =

  "block";

}

/* =====================================================

   GPS FIND

===================================================== */

document.getElementById(

"findButton"

).onclick =

function() {

  if (!currentLocation) {

    alert(

      "Waiting for GPS location..."

    );

    return;

  }

  openNewFind(

    currentLocation[0],

    currentLocation[1]

  );

};

/* =====================================================

   PLACE FIND

===================================================== */

document.getElementById(

"placeFindButton"

).onclick =

function() {

  placingFind =

  true;

  document.getElementById(

    "placeMessage"

  ).style.display =

  "block";

  document.getElementById(

    "map"

  ).style.cursor =

  "crosshair";

};

/* =====================================================

   CANCEL PLACE

===================================================== */

document.getElementById(

"cancelPlace"

).onclick =

function() {

  placingFind =

  false;

  document.getElementById(

    "placeMessage"

  ).style.display =

  "none";

  document.getElementById(

    "map"

  ).style.cursor =

  "";

  if (temporaryMarker) {

    map.removeLayer(

      temporaryMarker

    );

    temporaryMarker =

    null;

  }

};

/* =====================================================

   OPEN EXISTING FIND

===================================================== */

async function openFind(find) {

  editingFind =

  find;

  pendingPhoto =

  null;

  pendingPhotoRemoved =

  false;

  selectedLocation = {

    lat:

    Number(find.lat),

    lng:

    Number(find.lng)

  };

  document.getElementById(

    "title"

  ).innerText =

  "Edit Find";

  document.getElementById(

    "findNumber"

  ).innerText =

  "Find #" +

  (find.number || "unknown");

  document.getElementById(

    "positionInfo"

  ).innerText =

  "Saved position\n" +

  "Latitude: " +

  Number(find.lat).toFixed(7) +

  "\nLongitude: " +

  Number(find.lng).toFixed(7);

  document.getElementById(

    "find"

  ).value =

  find.find || "";

  document.getElementById(

    "material"

  ).value =

  find.material || "";

  document.getElementById(

    "era"

  ).value =

  find.era || "";

  document.getElementById(

    "remarks"

  ).value =

  find.remarks || "";

  document.getElementById(

    "recorded"

  ).innerText =

  find.recorded

  ?

  "Recorded: " +

  find.recorded

  :

  "";

  const preview =

  document.getElementById(

    "photoPreview"

  );

  preview.src =

  "";

  preview.style.display =

  "none";

  document.getElementById(

    "removePhoto"

  ).style.display =

  "none";

  try {

    if (find.id) {

      const blob =

      await getPhotoBlob(

        find.id

      );

      if (blob) {

        preview.src =

        URL.createObjectURL(

          blob

        );

        preview.style.display =

        "block";

        document.getElementById(

          "removePhoto"

        ).style.display =

        "block";

      }

    }

  }

  catch(error) {

    console.log(

      "Could not load photo:",

      error

    );

  }

  document.getElementById(

    "deleteFind"

  ).style.display =

  "block";

  document.getElementById(

    "form"

  ).style.display =

  "block";

}

/* =====================================================

   SAVE

===================================================== */

async function saveFind() {

  const saveButton =

  document.getElementById(

    "save"

  );

  saveButton.disabled =

  true;

  saveButton.innerText =

  "SAVING...";

  try {

    if (!selectedLocation) {

      alert(

        "No position has been selected."

      );

      return;

    }

    const lat =

    Number(

      selectedLocation.lat

    );

    const lng =

    Number(

      selectedLocation.lng

    );

    if (

      !Number.isFinite(lat) ||

      !Number.isFinite(lng)

    ) {

      alert(

        "The position is not valid."

      );

      return;

    }

    const findText =

    document.getElementById(

      "find"

    ).value.trim();

    const material =

    document.getElementById(

      "material"

    ).value.trim();

    const era =

    document.getElementById(

      "era"

    ).value.trim();

    const remarks =

    document.getElementById(

      "remarks"

    ).value.trim();

    /* EDIT */

    if (editingFind) {

      editingFind.find =

      findText;

      editingFind.material =

      material;

      editingFind.era =

      era;

      editingFind.remarks =

      remarks;

      editingFind.lat =

      lat;

      editingFind.lng =

      lng;

      await updateFind(

        editingFind

      );

      if (

        pendingPhotoRemoved

      ) {

        await deletePhotoBlob(

          editingFind.id

        );

      }

      if (pendingPhoto) {

        await savePhotoBlob(

          editingFind.id,

          pendingPhoto

        );

      }

      if (!editingFind.marker) {

        addMarker(

          editingFind

        );

      }

    }

    /* NEW FIND */

    else {

      const newFind = {

        number:

        nextFindNumber(),

        find:

        findText,

        material:

        material,

        era:

        era,

        remarks:

        remarks,

        lat:

        lat,

        lng:

        lng,

        recorded:

        formatDate(

          new Date()

        )

      };

      const savedFind =

      await addFind(

        newFind

      );

      finds.push(

        savedFind

      );

      if (pendingPhoto) {

        await savePhotoBlob(

          savedFind.id,

          pendingPhoto

        );

      }

      if (temporaryMarker) {

        map.removeLayer(

          temporaryMarker

        );

        temporaryMarker =

        null;

      }

      addMarker(

        savedFind

      );

    }

    /* CLOSE */

    document.getElementById(

      "form"

    ).style.display =

    "none";

    editingFind =

    null;

    pendingPhoto =

    null;

    pendingPhotoRemoved =

    false;

    selectedLocation =

    null;

    updateFindList();

  }

  catch(error) {

    console.error(

      "SAVE ERROR:",

      error

    );

    alert(

      "The find could not be saved.\n\n" +

      "Please try again."

    );

  }

  finally {

    saveButton.disabled =

    false;

    saveButton.innerText =

    "SAVE";

  }

}

document.getElementById(

"save"

).addEventListener(

"click",

function(event) {

  event.preventDefault();

  event.stopPropagation();

  saveFind();

}

);

/* =====================================================

   CANCEL

===================================================== */

document.getElementById(

"cancel"

).onclick =

function() {

  document.getElementById(

    "form"

  ).style.display =

  "none";

  editingFind =

  null;

  pendingPhoto =

  null;

  pendingPhotoRemoved =

  false;

  selectedLocation =

  null;

  if (temporaryMarker) {

    map.removeLayer(

      temporaryMarker

    );

    temporaryMarker =

    null;

  }

};

/* =====================================================

   DELETE

===================================================== */

document.getElementById(

"deleteFind"

).onclick =

async function() {

  if (!editingFind) {

    return;

  }

  if (

    !confirm(

      "Delete Find #" +

      editingFind.number +

      "?\n\n" +

      "This cannot be undone unless you have a backup."

    )

  ) {

    return;

  }

  try {

    await deleteFind(

      editingFind

    );

    if (editingFind.id) {

      await deletePhotoBlob(

        editingFind.id

      );

    }

    if (

      editingFind.marker

    ) {

      map.removeLayer(

        editingFind.marker

      );

    }

    const index =

    finds.indexOf(

      editingFind

    );

    if (index !== -1) {

      finds.splice(

        index,

        1

      );

    }

    editingFind =

    null;

    selectedLocation =

    null;

    document.getElementById(

      "form"

    ).style.display =

    "none";

    updateFindList();

  }

  catch(error) {

    console.error(

      "DELETE ERROR:",

      error

    );

    alert(

      "The find could not be deleted."

    );

  }

};

/* =====================================================

   FIND LIST

===================================================== */

function updateFindList() {

  const list =

  document.getElementById(

    "findList"

  );

  list.innerHTML =

  "";

  if (finds.length === 0) {

    list.innerHTML =

    '<div id="noFinds">No finds recorded yet.</div>';

    return;

  }

  const sorted =

  [...finds].sort(

    function(a, b) {

      return (

        Number(a.number || 0) -

        Number(b.number || 0)

      );

    }

  );

  sorted.forEach(

    function(find) {

      const item =

      document.createElement(

        "div"

      );

      item.className =

      "findItem";

      const title =

      document.createElement(

        "strong"

      );

      title.innerText =

      "Find #" +

      (find.number || "");

      if (find.find) {

        title.innerText +=

        " — " +

        find.find;

      }

      const details =

      document.createElement(

        "small"

      );

      let text =

      "";

      if (find.material) {

        text +=

        find.material;

      }

      if (find.era) {

        if (text) {

          text +=

          " · ";

        }

        text +=

        find.era;

      }

      details.innerText =

      text;

      item.appendChild(

        title

      );

      item.appendChild(

        details

      );

      item.onclick =

      function() {

        document.getElementById(

          "findsPanel"

        ).style.display =

        "none";

        map.setView(

          [

            Number(find.lat),

            Number(find.lng)

          ],

          19

        );

        openFind(find);

      };

      list.appendChild(

        item

      );

    }

  );

}

/* =====================================================

   FINDS PANEL

===================================================== */

document.getElementById(

"findsButton"

).onclick =

function() {

  updateFindList();

  document.getElementById(

    "findsPanel"

  ).style.display =

  "block";

};

document.getElementById(

"closeFinds"

).onclick =

function() {

  document.getElementById(

    "findsPanel"

  ).style.display =

  "none";

};

/* =====================================================

   CSV

===================================================== */

document.getElementById(

"csvButton"

).onclick =

function() {

  if (finds.length === 0) {

    alert(

      "There are no finds to export yet."

    );

    return;

  }

  function csvValue(value) {

    if (

      value === null ||

      value === undefined

    ) {

      value =

      "";

    }

    return (

      '"' +

      String(value)

      .replace(

        /"/g,

        '""'

      ) +

      '"'

    );

  }

  let csv =

  "\uFEFF";

  csv +=

  "Find Number,Find,Material,Date / Era,Remarks,Latitude,Longitude,Recorded\n";

  finds.forEach(

    function(find) {

      csv +=

      csvValue(

        find.number

      ) + "," +

      csvValue(

        find.find

      ) + "," +

      csvValue(

        find.material

      ) + "," +

      csvValue(

        find.era

      ) + "," +

      csvValue(

        find.remarks

      ) + "," +

      csvValue(

        find.lat

      ) + "," +

      csvValue(

        find.lng

      ) + "," +

      csvValue(

        find.recorded

      ) +

      "\n";

    }

  );

  const filename =

  "FindMapper_Finds_" +

  new Date()

  .toISOString()

  .slice(0,10) +

  ".csv";

  const blob =

  new Blob(

    [csv],

    {

      type:

      "text/csv;charset=utf-8;"

    }

  );

  const url =

  URL.createObjectURL(

    blob

  );

  const link =

  document.createElement(

    "a"

  );

  link.href =

  url;

  link.download =

  filename;

  document.body.appendChild(

    link

  );

  link.click();

  document.body.removeChild(

    link

  );

  setTimeout(

    function() {

      URL.revokeObjectURL(

        url

      );

    },

    1000

  );

};

/* =====================================================

   BACKUP

===================================================== */

document.getElementById(

"backupButton"

).onclick =

async function() {

  if (finds.length === 0) {

    alert(

      "There are no finds to back up yet."

    );

    return;

  }

  /*

     JSON backup contains the find information.

     Photos remain safely stored in IndexedDB.

  */

  const backup = {

    app:

    "Find Mapper",

    version:

    3,

    backupDate:

    new Date().toISOString(),

    finds:

    finds.map(

      function(find) {

        return {

          number:

          find.number,

          find:

          find.find || "",

          material:

          find.material || "",

          era:

          find.era || "",

          remarks:

          find.remarks || "",

          lat:

          find.lat,

          lng:

          find.lng,

          recorded:

          find.recorded || ""

        };

      }

    )

  };

  const json =

  JSON.stringify(

    backup,

    null,

    2

  );

  const filename =

  "FindMapper_Backup_" +

  new Date()

  .toISOString()

  .slice(0,10) +

  ".json";

  const blob =

  new Blob(

    [json],

    {

      type:

      "application/json"

    }

  );

  const url =

  URL.createObjectURL(

    blob

  );

  const link =

  document.createElement(

    "a"

  );

  link.href =

  url;

  link.download =

  filename;

  document.body.appendChild(

    link

  );

  link.click();

  document.body.removeChild(

    link

  );

  setTimeout(

    function() {

      URL.revokeObjectURL(

        url

      );

    },

    1000

  );

  alert(

    "Backup created successfully."

  );

};

/* =====================================================

   START APPLICATION

===================================================== */

async function startApplication() {

  try {

    await openDatabase();

    /*

       Load existing IndexedDB records.

    */

    finds =

    await getAllFinds();

    /*

       If there are no records in the new

       database, check the old localStorage

       version and migrate records.

    */

    if (finds.length === 0) {

      let oldFinds = [];

      try {

        oldFinds =

        JSON.parse(

          localStorage.getItem(

            "finds"

          ) || "[]"

        );

      }

      catch(error) {

        oldFinds =

        [];

      }

      if (

        Array.isArray(oldFinds) &&

        oldFinds.length > 0

      ) {

        for (

          let i = 0;

          i < oldFinds.length;

          i++

        ) {

          const old =

          oldFinds[i];

          const migrated = {

            number:

            old.number,

            find:

            old.find || "",

            material:

            old.material || "",

            era:

            old.era || "",

            remarks:

            old.remarks || "",

            lat:

            old.lat,

            lng:

            old.lng,

            recorded:

            old.recorded || ""

          };

          const saved =

          await addFind(

            migrated

          );

          finds.push(

            saved

          );

        }

      }

    }

    startMap();

    updateFindList();

  }

  catch(error) {

    console.error(

      "START ERROR:",

      error

    );

    alert(

      "Find Mapper could not start.\n\n" +

      "Please reload the page."

    );

  }

}

startApplication();

</script>
